[project]
name = "forever-guild-manager-api"
version = "0.1.0"
description = "API for Forever Guild Manager"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]